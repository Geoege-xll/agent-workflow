name: Native Windows validation gate

on:
  push:
    branches: ['codex/native-windows-*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run complete native acceptance or an independent capabilities-only diagnostic'
        type: choice
        options: [acceptance, capabilities]
        default: acceptance
        required: true
  # PR 与手动发行通过同仓相对引用消费同一提交；不接受可缩小范围的调用参数，
  # 也不继承发布 secret。显式 capabilities 模式只属于独立手动诊断。
  workflow_call:

permissions:
  contents: read

concurrency:
  # 与调用方 prepare-release 使用不同前缀；调用与独立 push 不会持同一把锁互等。
  group: windows-native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capabilities:
    # 探针已有独立证据。候选 push 执行完整登记，不在每次修改时重复独立探针；
    # 保留显式模式供有诊断依据时复用原入口，不把此 job 绿色提升为原生验收。
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'capabilities'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.11'
      - name: Probe independent Win32 capabilities
        env:
          PROBE_PYTHON: ${{ steps.python.outputs.python-path }}
        # 首轮固定 probe；不把原始 workflow input 插值到 shell 中。stdout 与 stderr
        # 均落完整日志，JSON 保存在脚本排他创建的私有目录；exit 0 仅代表报告已产出。
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-capabilities.log'
          # 启动和解释器校验之前排他创建日志；启动失败也必须保留原始错误，不能被
          # 后续“没有 artifact”掩盖。现有同名文件拒绝覆盖，由 Actions 控制台保留该失败。
          $stream = [System.IO.File]::Open($log, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
          $stream.Dispose()
          $code = 1
          $nativeCode = $null
          try {
            # 用户目标固定为 PowerShell 7+；记录实际消费者版本，再执行同一薄入口。
            $PSVersionTable | Out-String | Tee-Object -FilePath $log -Append
            if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell >= 7.0 is required.' }
            $python = $env:PROBE_PYTHON
            if ([string]::IsNullOrWhiteSpace($python)) { throw 'setup-python did not provide python-path.' }
            $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/windows_capabilities.ps1'
            $before = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'awf-windows-capabilities-*' -ErrorAction Stop | ForEach-Object FullName)
            "python_path=$python" | Tee-Object -FilePath $log -Append
            # 直接在当前 pwsh 7+ 中从 setup-python 的单值绝对路径进入薄入口；不查询 PATH，
            # 不插值输入、不修改 ExecutionPolicy，也不增加第二次 probe。
            & $script -Python $python -OutputParent $env:RUNNER_TEMP 2>&1 | Tee-Object -FilePath $log -Append
            $nativeCode = $LASTEXITCODE
            "probe_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
            if ($null -eq $nativeCode) { throw 'PowerShell probe entry did not provide an exit code.' }
            if ($nativeCode -ne 0) {
              $code = [int]$nativeCode
            } else {
              # 不能只凭退出码确认探针完成；只有本次新建根中的完整权威 JSON
              # 通过检查才确认“报告已产出”。JSON 仍不代表平台支持或桌面验收 PASS。
              $created = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'awf-windows-capabilities-*' -ErrorAction Stop | Where-Object { $_.FullName -notin $before })
              if ($created.Count -ne 1) { throw 'Expected exactly one new private probe workspace.' }
              $reportPath = Join-Path $created[0].FullName 'capabilities.json'
              $report = Get-Content -LiteralPath $reportPath -Raw -Encoding utf8 -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
              if ($report.schema_version -ne 1 -or $report.status -ne 'report-produced' -or $report.scope -ne 'capabilities-only' -or $report.support_status -ne 'NOT_EVALUATED' -or $report.report_file -ne $reportPath -or $report.workspace -ne $created[0].FullName) {
                throw 'Probe JSON is incomplete or does not match this invocation.'
              }
              "report_verified=$reportPath; support_status=NOT_EVALUATED" | Tee-Object -FilePath $log -Append
              $code = 0
            }
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append
            if ($null -eq $nativeCode) { 'probe_exit_code=not-started-or-unavailable' | Tee-Object -FilePath $log -Append }
            $code = 1
          } finally {
            "workflow_exit_code=$code" | Add-Content -LiteralPath $log -Encoding utf8
          }
          exit $code
      - name: Preserve complete capability evidence
        if: always()
        # 官方 release/commit 与官方 upload-pages-artifact 同一完整 SHA 已核验；只上传证据。
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-server-capabilities-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-capabilities.log
            ${{ runner.temp }}/awf-windows-capabilities-*/capabilities.json
          if-no-files-found: error
          retention-days: 14

  plan:
    # 可复用调用保留 caller 的 github.event_name：PR 是 pull_request，手动发行
    # 是 workflow_dispatch 且未提供 mode。空 mode 同样进入完整组；只有显式的
    # capabilities 手动诊断才排除，不能等待一个不会出现的 workflow_call 事件名。
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'capabilities'
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      component_count: ${{ steps.collect.outputs.component_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Collect the complete native registry without running tests
        id: collect
        shell: pwsh
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-native-plan.log'
          $stream = [System.IO.File]::Open($log, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
          $stream.Dispose()
          $code = 1
          try {
            $python = $env:NATIVE_PYTHON
            if ([string]::IsNullOrWhiteSpace($python)) { throw 'setup-python did not provide python-path.' }
            $entry = Join-Path $env:GITHUB_WORKSPACE 'scripts/test_workflow.py'
            "source_sha=$env:GITHUB_SHA" | Tee-Object -FilePath $log -Append
            "command=$python -I -B -X utf8 $entry --matrix windows-native" | Tee-Object -FilePath $log -Append
            # 唯一 runner 真实导入每个节点并生成实际方法数；这里不执行 TestCase，
            # 不从 YAML/环境再拼名单。完整 stderr 即使解析失败也保留在计划日志。
            $lines = @(& $python -I -B -X utf8 $entry --matrix windows-native 2>&1)
            $nativeCode = $LASTEXITCODE
            $lines | Tee-Object -FilePath $log -Append
            "selection_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
            if ($null -eq $nativeCode -or $nativeCode -ne 0) { throw 'The full native registry could not be collected.' }
            $body = ($lines | Out-String).Trim()
            $matrix = $body | ConvertFrom-Json -ErrorAction Stop
            if ($null -eq $matrix.include -or @($matrix.include).Count -eq 0) { throw 'An empty native matrix cannot satisfy acceptance.' }
            # JSON 由受控 runner 单行输出，无用户正文或 shell 求值；只有完整收集
            # 成功才发布 Actions output。计划成功本身仍不是任何原生方法的 PASS。
            "matrix=$body" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            "component_count=$(@($matrix.include).Count)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            $code = 0
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append
          } finally {
            "workflow_exit_code=$code" | Add-Content -LiteralPath $log -Encoding utf8
          }
          exit $code
      - name: Preserve complete native plan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-native-plan.log
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native evidence | ${{ matrix.group }} | methods=${{ matrix.methods }}
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: windows-2025
    # 完整组件的 job 预算覆盖环境准备/取证；生产 Hook、消费者与 Job 内部超时
    # 保持原值，不能用 CI 总时限代替单操作预算或掩盖资源回收失败。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Run the registered native component (methods=${{ matrix.methods }})
        env:
          NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
          NATIVE_STAGE: ${{ matrix.group }}
          NATIVE_METHODS: ${{ matrix.methods }}
          NATIVE_NODE_REQUIRED: ${{ matrix.node_required }}
          NATIVE_CURSES_REQUIRED: ${{ matrix.curses_required }}
          NATIVE_QUALIFICATION: ${{ matrix.qualification }}
        run: |
          # stage 仅来自上方固定 matrix 常量，不读取用户输入或提交内容；作为独立
          # argv 单值调用同一 Python 入口，既不求值 shell，也不在 YAML 重复方法名。
          $stage = $env:NATIVE_STAGE
          $log = Join-Path $env:RUNNER_TEMP "$stage.log"
          # 原始日志排他创建；任何失败均追加，不覆盖上一条输出或把启动失败算作 skip。
          $stream = [System.IO.File]::Open($log, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
          $stream.Dispose()
          $code = 1
          try {
            # fixture 在清理前把已知 engine/安装日志追加到独立文件。排他创建后
            # 立即关闭句柄，不能与 Tee 持续写入的主日志共用同一路径而触发 Win
            # 共享锁冲突；环境变量只存在于本 stage 进程及其测试子进程，不写 GITHUB_ENV。
            $processLog = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "${stage}-process.log"))
            $processStream = [System.IO.File]::Open($processLog, [System.IO.FileMode]::CreateNew, [System.IO.FileAccess]::Write, [System.IO.FileShare]::Read)
            $processStream.Dispose()
            $env:AWF_TEST_EVIDENCE_LOG = $processLog
            "process_evidence_path=$processLog" | Tee-Object -FilePath $log -Append
            $PSVersionTable | Out-String | Tee-Object -FilePath $log -Append
            if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell >= 7.0 is required.' }
            $python = $env:NATIVE_PYTHON
            if ([string]::IsNullOrWhiteSpace($python)) { throw 'setup-python did not provide python-path.' }
            "stage=$stage" | Tee-Object -FilePath $log -Append
            # 资格仅记录该组件所需测试环境，不作为过滤条件；完整 Server gate
            # 仍执行 elevated 专项，实际权限/flag 准备失败须由真实用例失败留证。
            "qualification=$env:NATIVE_QUALIFICATION" | Tee-Object -FilePath $log -Append
            "scope=registered-component; method_count=$env:NATIVE_METHODS" | Tee-Object -FilePath $log -Append
            "source_sha=$env:GITHUB_SHA" | Tee-Object -FilePath $log -Append
            "python_path=$python" | Tee-Object -FilePath $log -Append
            $runtimeCheck = 'import platform,struct,sys; print(sys.version); print(platform.platform()); print("pointer_bits="+str(struct.calcsize("P")*8)); raise SystemExit(0 if sys.version_info >= (3,11) and struct.calcsize("P")==8 else 1)'
            # PowerShell 7.0/7.2 仍采用 Legacy native argv 规则；源码内的引号不能
            # 经 -c 参数传递。固定 ASCII 源码通过 stdin 输入 Python '-'，避免依赖
            # 7.3+ 参数转义，同时完整记录实际输入，不增加临时脚本或 shell 求值。
            "command=$python -I -B -X utf8 -" | Tee-Object -FilePath $log -Append
            "stdin=$runtimeCheck" | Tee-Object -FilePath $log -Append
            $runtimeCheck | & $python -I -B -X utf8 - 2>&1 | Tee-Object -FilePath $log -Append
            $nativeCode = $LASTEXITCODE
            "runtime_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
            if ($null -eq $nativeCode -or $nativeCode -ne 0) { throw 'The explicit Python must be >= 3.11 and x64.' }
            if ($env:NATIVE_NODE_REQUIRED -eq 'true') {
              # 中央阶段沿用既有 Node 前置，待实际 Hook 消费者核对后再决定删减；
              # HTML 暂停不构成删除其它消费者运行时的依据。不安装/下载或改 PATH，
              # 缺失、执行失败和不足 20 的真实版本都终止该阶段并完整留证。
              # 精确 .exe 查询仍可能命中多个 PATH 条目；先按命令查找顺序选定单个
              # ApplicationInfo，再读取其单值 Path。禁止将 Source/Path 数组传给
              # 字符串校验或调用运算符；完全限定路径也排除 C:relative 等盘符相对形式。
              $nodeApplications = @(Get-Command -Name 'node.exe' -CommandType Application -ErrorAction Stop)
              if ($nodeApplications.Count -eq 0) { throw 'An existing native node.exe application is required.' }
              $node = $nodeApplications[0].Path
              if ($node -isnot [string] -or [string]::IsNullOrWhiteSpace($node) -or -not [System.IO.Path]::IsPathFullyQualified($node) -or -not [System.IO.File]::Exists($node)) {
                throw 'The selected node.exe must have one nonempty fully qualified existing application path.'
              }
              "node_path=$node" | Tee-Object -FilePath $log -Append
              "command=$node --version" | Tee-Object -FilePath $log -Append
              $nodeVersion = & $node --version 2>&1
              $nativeCode = $LASTEXITCODE
              $nodeVersion | Tee-Object -FilePath $log -Append
              "node_version_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
              if ($null -eq $nativeCode -or $nativeCode -ne 0) { throw 'The existing Node application could not report its version.' }
              $nodeText = ($nodeVersion | Out-String).Trim()
              $nodeMatch = [regex]::Match($nodeText, '^v(?<major>[0-9]+)\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$')
              if (-not $nodeMatch.Success) { throw 'The existing Node version is not recognizable.' }
              if ([int]($nodeMatch.Groups['major'].Value) -lt 20) { throw 'An existing Node >= 20 is required for this native stage.' }
            }
            # 仅明确需要 curses 的固定 matrix 常量允许安装；库阶段仍用无 pip 的 stdlib
            # 环境。TUI venv 保留解释器自带 ensurepip，不能 --without-pip 后直接调用
            # 不存在的 pip，也不升级 pip、改全局解释器或 PATH。每个 stage 独占目录。
            $withCurses = $env:NATIVE_CURSES_REQUIRED -eq 'true'
            $venv = Join-Path $env:RUNNER_TEMP "awf-${stage}-venv"
            if (Test-Path -LiteralPath $venv) { throw 'The owned native virtual environment already exists.' }
            $venvArguments = @('-I', '-B', '-X', 'utf8', '-m', 'venv')
            if (-not $withCurses) { $venvArguments += '--without-pip' }
            $venvArguments += $venv
            "command=$python $($venvArguments -join ' ')" | Tee-Object -FilePath $log -Append
            & $python @venvArguments 2>&1 | Tee-Object -FilePath $log -Append
            $nativeCode = $LASTEXITCODE
            "venv_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
            if ($null -eq $nativeCode -or $nativeCode -ne 0) { throw 'The owned native virtual environment could not be created.' }
            $python = Join-Path $venv 'Scripts/python.exe'
            if ($withCurses) {
              # 唯一依赖源是仓内官方 wheel 哈希锁；isolated 忽略用户 pip 环境/配置，
              # require-hashes 与 only-binary 拒绝未锁载荷及源码回退。完整安装输出和
              # 退出码追加同一主日志，失败即终止，不能靠随后 skip 伪造原生通过。
              $requirements = Join-Path $env:GITHUB_WORKSPACE 'requirements-windows.txt'
              "command=$python -I -B -X utf8 -m pip --isolated --disable-pip-version-check --no-input install --require-hashes --only-binary=:all: -r $requirements" | Tee-Object -FilePath $log -Append
              & $python -I -B -X utf8 -m pip --isolated --disable-pip-version-check --no-input install --require-hashes --only-binary=:all: -r $requirements 2>&1 | Tee-Object -FilePath $log -Append
              $nativeCode = $LASTEXITCODE
              "dependency_install_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
              if ($null -eq $nativeCode -or $nativeCode -ne 0) { throw 'The locked native TUI dependency could not be installed.' }
            }
            # 所有测试临时文件均限制在本次 job 自有目录，沿用原测试清理责任；完整
            # 命令日志保留在目录之外，失败后仍可上传，不触碰真实 HOME/state/业务项目。
            $data = Join-Path $env:RUNNER_TEMP "awf-${stage}-data"
            if (Test-Path -LiteralPath $data) { throw 'The owned native data directory already exists.' }
            [System.IO.Directory]::CreateDirectory($data) | Out-Null
            $env:TEMP = $data
            $env:TMP = $data
            $entry = Join-Path $env:GITHUB_WORKSPACE 'scripts/test_workflow.py'
            "command=$python -I -B -X utf8 $entry --list $stage" | Tee-Object -FilePath $log -Append
            & $python -I -B -X utf8 $entry --list $stage 2>&1 | Tee-Object -FilePath $log -Append
            $nativeCode = $LASTEXITCODE
            "selection_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
            if ($null -eq $nativeCode -or $nativeCode -ne 0) { throw 'The fixed native stage selection did not resolve every real node.' }
            # matrix 与方法清单均来自 Python 唯一登记，不在 YAML 重写。runner 同时拒绝
            # 缺失、未执行和方法/子场景 skip，不能把 mock 或全 skip 当成原生成功。
            "command=$python -I -B -X utf8 $entry $stage" | Tee-Object -FilePath $log -Append
            & $python -I -B -X utf8 $entry $stage 2>&1 | Tee-Object -FilePath $log -Append
            $nativeCode = $LASTEXITCODE
            "native_stage_exit_code=$nativeCode" | Tee-Object -FilePath $log -Append
            if ($null -eq $nativeCode) { throw 'The fixed native stage runner did not provide an exit code.' }
            $code = [int]$nativeCode
          } catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append
            $code = 1
          } finally {
            "workflow_exit_code=$code" | Add-Content -LiteralPath $log -Encoding utf8
          }
          exit $code
      - name: Preserve complete fixed native stage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-server-${{ matrix.group }}-methods-${{ matrix.methods }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ matrix.group }}.log
            ${{ runner.temp }}/${{ matrix.group }}-process.log
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Complete native Windows gate
    needs: [plan, native]
    # needs 默认传播失败/skip；必须 always 进入真实汇总并明确拒绝，避免整个
    # 验收 job 因上游 skip 被展示成可忽略状态。capabilities-only 从不声称完整验收。
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'capabilities')
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Require the complete nonempty native matrix to succeed
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          COMPONENT_COUNT: ${{ needs.plan.outputs.component_count }}
        run: |
          $count = 0
          if ($env:PLAN_RESULT -ne 'success' -or $env:NATIVE_RESULT -ne 'success' -or
              -not [int]::TryParse($env:COMPONENT_COUNT, [ref]$count) -or $count -le 0) {
            Write-Error "Complete native gate rejected: plan=$env:PLAN_RESULT native=$env:NATIVE_RESULT components=$env:COMPONENT_COUNT"
            exit 1
          }
          # 每个矩阵 job 已由 runner 检查方法/子场景零 skip、缺失和未执行，并完成
          # 双完整日志上传；此处只确认全组件结算，不把 Server 结果改称 Win11 桌面证据。
          Write-Output "Complete native Windows Server matrix passed: components=$count; Windows 11 client acceptance remains separate."
