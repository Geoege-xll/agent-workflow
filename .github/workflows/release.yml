name: Validate current products and build release candidates

on:
  pull_request:
  push:
    branches: [main, 'codex/plugin-v3-*']

# PR 与开发分支只读源码并上传当前运行的候选附件，不创建 tag 或 GitHub Release。
# 旧 2.x 发行源码由 Git 历史保留，不再进入当前产品自动交付链。
permissions:
  contents: read

concurrency:
  group: current-products-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check native console JavaScript runtime
        # 保留的 Node 消费者是独立配置网页的真实 JS 合同；缺失必须失败，不能 skip 假绿。
        run: |
          set -euo pipefail
          command -v node
          node --version
      - name: Show current products and retained prototype scope
        run: bash scripts/test_workflow.sh --list current
      - name: Validate plugin, native configuration and retained prototype chain
        run: bash scripts/test_workflow.sh current

  candidate:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build both independent release products from the checked source
        run: bash lib/python_runtime.sh -B -X utf8 packaging/build_candidates.py --output-dir "$RUNNER_TEMP/awf-candidate"
      - name: Summarize exact source, independent versions and artifact checksums
        run: cat "$RUNNER_TEMP/awf-candidate/CANDIDATE.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload seven candidate packages and provenance
        # 官方 v4.6.2 release 对应的完整提交；只上传 ZIP/摘要，不上传展开的临时市场目录。
        # https://github.com/actions/upload-artifact/releases/tag/v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/awf-candidate/workflow/*.zip
            ${{ runner.temp }}/awf-candidate/workflow/*.zip.sha256
            ${{ runner.temp }}/awf-candidate/native/*.zip
            ${{ runner.temp }}/awf-candidate/native/*.zip.sha256
            ${{ runner.temp }}/awf-candidate/candidate-manifest.json
            ${{ runner.temp }}/awf-candidate/SHA256SUMS
            ${{ runner.temp }}/awf-candidate/CANDIDATE.md
          if-no-files-found: error
          retention-days: 14
          overwrite: false
