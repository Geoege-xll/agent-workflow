<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 以下是 prepare-delivery 幂等插入的精确受管标签示例，不在未准备模板中激活缺失依赖：
       <script src=".xy-prototype-entry/entry.js" data-xy-delivery-entry="1" charset="utf-8"></script>
       Agent／PM 交付前必须执行 prepare-delivery，再执行 open；实际标签须先于所有业务脚本。
       未准备的裸模板仅用于静态自查，不能作为完整交付。机器路径、绑定和工具摘要留在项目外。 -->
  <title>页面原型</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body class="prototype-canvas" data-prototype-platform="web" data-prototype-display="responsive" data-prototype-plan-source="">
  <!-- 项目只维护这份具体原稿与必要业务样式；Agent 交付前先用可信 CLI prepare-delivery
       准备受管入口，再用 open 启动受限评审服务。delivery_url 为本具体页 file URI，
       唯一中央 shell 提供完整目录、画布与同页评审导航；来源键仅在 HTTP 响应注入。
       不落盘活动业务 HTML 副本，不把 token、机器路径、随机端口或保留属性写回原稿。
       业务元素可明确声明 data-req-ids="REQ-001 REQ-002"；没有映射时保留空数组语义，
       不从元素文字猜测需求。匿名来源键由工具装配并在 validate 重读源时独立重建。 -->
  <header class="prototype-header prototype-shell">
    <!-- 只有项目实际有目录页时才添加返回链接，独立源页不依赖通用index。 -->
    <div class="prototype-heading-copy"><h1 id="prototype-page-title" tabindex="-1">页面原型</h1><p class="prototype-description">在此填写当前页面的职责与紧凑简述。</p></div>
    <!-- 历史预留入口保持隐藏；新评审的导航和页面整改来自项目外工作台浮动控件，
         不在独立业务页恢复旧壳交互，状态始终由父工作台唯一 state 持有。 -->
    <button id="prototype-page-sidebar-toggle" class="prototype-sidebar-toggle" type="button" aria-expanded="true" hidden><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="2.75" y="3.25" width="14.5" height="13.5" rx="2"></rect><path d="M7.25 3.5v13"></path></svg><span id="prototype-page-sidebar-toggle-label">收起侧栏</span></button>
    <button id="prototype-page-feedback" class="prototype-sidebar-toggle" type="button" hidden>页面反馈</button>
  </header>
  <!-- Web 保持自然流；iOS／PC 改为 fixed，填写 --prototype-frame-width /
       --prototype-frame-height（CSS px），同步页底尺寸说明，并为 fixed stage
       加 tabindex="0"。产品导航、浮层和滚动只属于下方画板内部。 -->
  <div class="prototype-stage" role="region" aria-label="当前页面原型">
    <div class="prototype-frame">
      <main class="prototype-content" data-prototype-page-content>
        <!-- 用已批准的设计替换占位内容，不复制工作区样稿的虚构业务。 -->
        <div class="prototype-placeholder"><p>产品页面内容</p></div>
      </main>
    </div>
  </div>
  <!-- 信息排在画面后。绑定时把 body 来源设为配置 plans 下项目相对 .md 路径，
       并在唯一导航槽填写真实 Markdown 锚点；只有同 stem 历史 HTML 实际存在时才可选填其锚点。
       计划 Markdown→HTML 生成链已退役，不补造派生页。文档独立打开，不替换受控预览。
       <a href="真实相对路径.html" data-prototype-document="html" target="_blank" rel="noopener">阅读需求 HTML</a>
       <a href="真实相对路径.md" data-prototype-document="markdown" target="_blank" rel="noopener">需求原稿 Markdown</a>
       源模板未绑定时保留空槽；真实交付页必须绑定，不使用 # 或虚构文件充当需求链接。 -->
  <footer class="prototype-page-information prototype-shell">
    <div class="prototype-information-row"><nav class="prototype-requirement-links" aria-label="关联需求文档"><span>尚未绑定需求文档</span></nav><p class="prototype-meta">Web · 响应式内容区 · CSS px</p></div>
    <p class="prototype-demo-note"><strong>演示说明</strong> 此模板尚无业务数据和业务操作。实际页面应在这里简述模拟数据、刷新重置及未实现范围。</p>
  </footer>
  <!-- 只填写已经确认、操作画面仍无法确定的行为，例如提交超时后的输入保留与重试条件。
       已由界面表达的跳转不用复述；已有规则在上方需求链接使用真实 #章节。没有补充时留空。
       body 可用 data-prototype-group="用户端/订单" 声明已确认的层级，各页复用真实分组。 -->
  <details class="prototype-contract">
    <summary id="prototype-contract-toggle">开发说明</summary>
  </details>
</body>
</html>
